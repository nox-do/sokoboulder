name: Keep latest two releases

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: release-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove older published releases and their assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          jq -r 'add | map(select(.draft == false and .published_at != null))
            | sort_by(.published_at, .id) | reverse | .[2:] | .[].id' releases.json > obsolete.txt
          while IFS= read -r release_id; do
            echo "Deleting release $release_id (Git tag retained)"
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          done < obsolete.txt
